<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mystreamingserver.live · fleet admin</title>
<style>
  :root{
    --bg:#080b10; --panel:#11161f; --panel2:#1a212e; --elev:#161c27;
    --border:#242c39; --border2:#2f3948;
    --fg:#e8eef6; --muted:#7d8695; --muted2:#5b6472;
    --green:#3fb950; --amber:#e3b341; --red:#f85149; --blue:#58a6ff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:
        radial-gradient(1200px 500px at 80% -10%,rgba(88,166,255,.06),transparent 60%),var(--bg);
       color:var(--fg);-webkit-font-smoothing:antialiased;
       font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
         padding:15px 24px;border-bottom:1px solid var(--border);
         background:linear-gradient(180deg,var(--elev),var(--panel));
         position:sticky;top:0;z-index:10;backdrop-filter:blur(6px)}
  header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.4px}
  header .host{color:var(--muted);font-size:12px}
  .status{margin-left:auto;padding:6px 16px;border-radius:20px;font-weight:700;
          letter-spacing:.8px;font-size:12px;text-transform:uppercase}
  .status.HEALTHY{background:rgba(63,185,80,.12);color:var(--green);box-shadow:inset 0 0 0 1px rgba(63,185,80,.4),0 0 12px rgba(63,185,80,.15)}
  .status.DEGRADED{background:rgba(227,179,65,.12);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(227,179,65,.4),0 0 12px rgba(227,179,65,.15)}
  .status.DOWN{background:rgba(248,81,73,.12);color:var(--red);box-shadow:inset 0 0 0 1px rgba(248,81,73,.4),0 0 12px rgba(248,81,73,.15)}
  .status.STALE{background:rgba(125,134,149,.12);color:var(--muted);box-shadow:inset 0 0 0 1px rgba(125,134,149,.35)}
  .refresh{color:var(--muted2);font-size:12px}
  .nodegrid{padding:18px 24px;display:grid;gap:14px;
       grid-template-columns:repeat(auto-fill,minmax(210px,1fr));max-width:1440px}
  #grid{padding-bottom:24px}
  /* fleet layout */
  .fleettotal{display:flex;gap:48px;flex-wrap:wrap;padding:20px 26px;margin:20px 24px 0;
              background:linear-gradient(180deg,var(--elev),var(--panel));
              border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .fleettotal:empty{display:none}
  .fleettotal .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
  .fleettotal .big{font-size:38px;font-weight:800;color:var(--blue);line-height:1;letter-spacing:-1px}
  .fleettotal .big.green{color:var(--green)} .fleettotal .big.amber{color:var(--amber)} .fleettotal .big.red{color:var(--red)}
  .fleettotal .sub{color:var(--muted2);font-size:12px;margin-top:5px}
  .nodesec{border-top:1px solid var(--border);margin-top:10px}
  .nodehead{display:flex;align-items:center;gap:12px;padding:18px 24px 2px}
  .nodename{font-size:15px;font-weight:700;letter-spacing:.3px}
  .selftag{font-size:9px;background:var(--blue);color:#080b10;padding:2px 7px;border-radius:20px;vertical-align:middle;font-weight:700;letter-spacing:.5px}
  .roletag{font-size:9px;background:var(--panel2);color:var(--muted);padding:2px 7px;border-radius:20px;vertical-align:middle;text-transform:uppercase;letter-spacing:.5px;box-shadow:inset 0 0 0 1px var(--border2)}
  .pubpanel{margin:18px 24px 0;padding:16px 18px;background:linear-gradient(180deg,var(--elev),var(--panel));border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .publist{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .pubip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
         border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;box-shadow:inset 0 0 0 1px var(--border2)}
  .pubx{background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;line-height:1;padding:0 4px;border-radius:50%;transition:background .15s}
  .pubx:hover{background:rgba(248,81,73,.15)}
  .pubadd{display:flex;gap:8px;align-items:center;margin-top:8px}
  .pubadd input{background:var(--bg);border:1px solid var(--border2);color:var(--fg);border-radius:8px;
                padding:7px 11px;font:13px ui-monospace,monospace;width:220px;outline:none;transition:border-color .15s}
  .pubadd input:focus{border-color:var(--blue)}
  .pubadd button{background:var(--blue);color:#080b10;border:none;border-radius:8px;padding:7px 14px;
                 font-weight:700;cursor:pointer;font-size:13px;transition:filter .15s}
  .pubadd button:hover{filter:brightness(1.1)}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px 17px;
        box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
  .tile:hover{border-color:var(--border2);transform:translateY(-1px)}
  .tile.wide{grid-column:span 2}
  .tile .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
  .tile .val{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.5px}
  .tile .sub{color:var(--muted2);font-size:12px;margin-top:6px}
  .val.green{color:var(--green)} .val.amber{color:var(--amber)} .val.red{color:var(--red)} .val.blue{color:var(--blue)}
  .bar{height:7px;background:var(--panel2);border-radius:20px;overflow:hidden;margin-top:10px;box-shadow:inset 0 0 0 1px var(--border)}
  .bar>span{display:block;height:100%;border-radius:20px;transition:width .4s ease}
  .bar.green>span{background:linear-gradient(90deg,#2ea043,var(--green))}
  .bar.amber>span{background:linear-gradient(90deg,#bf8700,var(--amber))}
  .bar.red>span{background:linear-gradient(90deg,#da3633,var(--red))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:var(--panel2)}
  th{color:var(--muted2);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .dot.ok{background:var(--green);box-shadow:0 0 6px rgba(63,185,80,.5)}
  .dot.bad{background:var(--red);box-shadow:0 0 6px rgba(248,81,73,.5)}
  .spread{display:flex;gap:6px;align-items:flex-end;height:62px;margin-top:10px}
  .spread .col{flex:1;background:linear-gradient(180deg,var(--blue),#3d7fd6);border-radius:4px 4px 0 0;min-height:3px;
               display:flex;align-items:flex-start;justify-content:center;color:#080b10;font-size:11px;font-weight:700;padding-top:3px}
  .err{color:var(--red);padding:20px}
</style>
</head>
<body>
<header>
  <h1 id="title">fleet admin</h1>
  <span class="host" id="host">connecting…</span>
  <span class="status STALE" id="status">…</span>
  <span class="refresh" id="refresh">connecting…</span>
</header>
<div class="fleettotal" id="fleettotal"></div>
<div id="pubhost"></div>
<div id="grid"></div>

<script>
const CEIL_DEFAULT = 84;
const $ = (id) => document.getElementById(id);

function fmtBytes(b){ if(!b) return '0'; const u=['B','KB','MB','GB','TB']; let i=0,n=b; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(1)+u[i]; }
function fmtDur(s){ const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?d+'d ':'')+h+'h '+m+'m'; }
function cls(pct,warn,crit){ return pct>=crit?'red':pct>=warn?'amber':'green'; }

function tile(label,val,valCls,sub,extra){
  return `<div class="tile"><div class="label">${label}</div>
    <div class="val ${valCls||''}">${val}</div>
    ${sub?`<div class="sub">${sub}</div>`:''}${extra||''}</div>`;
}

// Build one node's tiles into the given grid element.
function renderNode(d, grid){
  const ceil = d.capacity ? d.capacity.ceiling : CEIL_DEFAULT;

  // Source
  grid.insertAdjacentHTML('beforeend', tile('Source', d.source,
    d.source==='LIVE'?'green':d.source==='DEAD'?'red':'',
    d.source==='DEAD'?'publishing but 0 video — check OBS!':d.source==='OFFLINE'?'no publisher':'nclients pull: '+d.nclients));

  // bw_video
  grid.insertAdjacentHTML('beforeend', tile('Source video bw', (d.bwVideo||0)+' <span style="font-size:13px">kbps</span>',
    d.source==='DEAD'?'red':d.bwVideo>0?'green':'', 'rtmp uptime '+fmtDur(d.rtmpUptime||0)));

  // Viewers
  // Connected != watching. With the source off, people leave the tab open and
  // their endpoint stays alive with nothing to send — real connections, but not
  // viewers of anything. Show both so the number cannot mislead.
  const idle = d.idle != null ? d.idle : 0;
  const playing = d.playing != null ? d.playing : d.viewers;
  grid.insertAdjacentHTML('beforeend', tile('Live viewers', playing, 'blue',
    idle > 0 ? idle + ' idle (no source) · ' + d.viewers + ' connected'
             : 'across ' + (d.perInstance.length || 0) + ' kurento'));

  // Capacity / peak
  const cp = d.capacity||{pct:0,nearPeak:false};
  const capCls = cls(cp.pct,70,90);
  grid.insertAdjacentHTML('beforeend', tile('Capacity vs peak',
    cp.pct.toFixed(0)+'%', capCls,
    playing+' / ~'+ceil+(cp.nearPeak?' · NEAR PEAK':' headroom'),
    `<div class="bar ${capCls}"><span style="width:${Math.min(cp.pct,100)}%"></span></div>`));

  // Per-kurento spread
  const spread = d.perInstance.length
    ? `<div class="spread">${d.perInstance.map((n,i)=>{const mx=Math.max(1,...d.perInstance);return `<div class="col" style="height:${Math.max(6,n/mx*100)}%" title="kurento-${i}: ${n}">${n}</div>`}).join('')}</div>`
    : '<div class="sub">no data</div>';
  grid.insertAdjacentHTML('beforeend', `<div class="tile wide"><div class="label">Per-Kurento spread</div>${spread}</div>`);

  // Host load
  const lp = d.host.loadPct||0;
  grid.insertAdjacentHTML('beforeend', tile('Host load (1m)', d.host.load1, cls(lp,70,90),
    lp.toFixed(0)+'% of '+d.host.cores+' cores · '+d.host.load5+' / '+d.host.load15,
    `<div class="bar ${cls(lp,70,90)}"><span style="width:${Math.min(lp,100)}%"></span></div>`));

  // Host mem
  const mp = d.host.memPct||0;
  grid.insertAdjacentHTML('beforeend', tile('Host memory', mp.toFixed(0)+'%', cls(mp,80,90),
    fmtBytes(d.host.memUsed)+' / '+fmtBytes(d.host.memTotal)+' · up '+fmtDur(d.host.uptime),
    `<div class="bar ${cls(mp,80,90)}"><span style="width:${Math.min(mp,100)}%"></span></div>`));

  // Kurento table
  const rows = (d.kurento||[]).map(k=>`<tr>
    <td><span class="dot ${k.unhealthy?'bad':'ok'}"></span>${k.name}</td>
    <td>${k.cpu||'-'}</td><td>${(k.mem||'').split(' / ')[0]}</td>
    <td style="color:var(--muted)">${k.status||''}</td></tr>`).join('');
  grid.insertAdjacentHTML('beforeend', `<div class="tile wide" style="grid-column:span 2">
    <div class="label">Kurento containers (${d.kurento.length}) ${d.kurentoUnhealthy?'· <span style="color:var(--red)">'+d.kurentoUnhealthy+' unhealthy</span>':''}</div>
    <table><thead><tr><th>name</th><th>cpu</th><th>mem</th><th>status</th></tr></thead><tbody>${rows||'<tr><td colspan=4>none</td></tr>'}</tbody></table></div>`);
}

// Single-node view: header reflects this node, one grid.
function render(d){
  $('status').className = 'status '+d.status;
  $('status').textContent = d.status;
  $('host').textContent = (d.host&&d.host.hostname||'')+' · '+(d.host&&d.host.cores||'?')+' cores';
  $('title').textContent = (d.host&&d.host.hostname||'node')+' · webrtc-swc';
  const root = $('grid'); root.innerHTML='';
  const g = document.createElement('main'); g.className='nodegrid'; root.appendChild(g);
  renderNode(d, g);
}

// Fleet view: a titled section per node + a fleet-total banner.
function renderFleet(f){
  const nodes = f.nodes||[];
  const live = nodes.filter(n=>n.status&&n.status!=='STALE').length;
  $('title').textContent = 'FLEET · webrtc-swc';
  $('host').textContent = nodes.length+' nodes · '+live+' up';
  const worst = nodes.some(n=>n.status==='DOWN'||n.status==='STALE') ? 'DEGRADED'
              : nodes.some(n=>n.status==='DEGRADED') ? 'DEGRADED' : 'HEALTHY';
  $('status').className='status '+worst; $('status').textContent=worst;

  // fleet total banner (rebuilt each poll)
  // Capacity tracks what is actually being SERVED, not open sockets.
  const fPlaying = f.totalPlaying != null ? f.totalPlaying : f.totalViewers;
  const fIdle = f.totalIdle != null ? f.totalIdle : 0;
  const capPct = f.ceiling ? Math.round(fPlaying/f.ceiling*100) : 0;
  $('fleettotal').innerHTML = `
    <div><div class="label">Fleet live viewers</div><div class="big">${fPlaying}</div>
      ${fIdle > 0 ? `<div class="sub">${fIdle} idle · ${f.totalViewers} connected</div>` : ''}</div>
    <div><div class="label">Sources live</div><div class="big">${nodes.filter(n=>n.source==='LIVE').length}/${nodes.length}</div></div>
    <div><div class="label">Fleet capacity</div><div class="big ${capPct>=90?'red':capPct>=70?'amber':'green'}">${capPct}%</div><div class="sub">${fPlaying} / ~${f.ceiling}</div></div>`;

  // Publisher panel is built ONCE (persistent) so polling doesn't wipe the
  // input mid-type or re-fetch the list every 3s — it only changes on edit.
  if (!$('pubpanel')){
    $('pubhost').innerHTML = `<div class="pubpanel" id="pubpanel">
      <div class="label">Publisher allowlist — IPs allowed to push OBS (fleet-wide) <span id="pubopen"></span></div>
      <div id="publist" class="publist"><span class="sub">loading…</span></div>
      <div class="pubadd">
        <input id="pubip" placeholder="e.g. 180.190.169.107" spellcheck="false">
        <button id="pubaddbtn">+ Add IP</button>
        <span id="pubmsg" class="sub"></span>
      </div></div>`;
    wirePublishers();
  }

  const root = $('grid'); root.innerHTML='';   // only the per-node sections rebuild each poll
  // per-node section
  nodes.forEach(n=>{
    const sec = document.createElement('section'); sec.className='nodesec';
    const badge = n.status||'STALE';
    sec.insertAdjacentHTML('beforeend', `<div class="nodehead">
      <span class="nodename">${n.name||n.host?.hostname||'node'}${n.role?` <span class="roletag">${n.role}</span>`:''}${n.self?' <span class="selftag">this</span>':''}</span>
      <span class="status ${badge}">${badge}</span>
      ${n.error?`<span class="refresh">${n.error}</span>`:`<span class="refresh">${n.source} · ${n.viewers||0} viewers</span>`}</div>`);
    const g = document.createElement('main'); g.className='nodegrid'; sec.appendChild(g);
    if(n.error||!n.host){ g.insertAdjacentHTML('beforeend', `<div class="tile"><div class="val red">${badge}</div><div class="sub">${n.error||'no data'}</div></div>`); }
    else renderNode(n, g);
    root.appendChild(sec);
  });
}

// ---- publisher allowlist UI ----
const IP_RE=/^(\d{1,3}\.){3}\d{1,3}$/;
async function loadPublishers(){
  try{
    const r=await fetch('/admin/api/publishers',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    const el=$('publist'); if(!el) return;
    $('pubopen').textContent = d.open ? '· OPEN (anyone can push — add an IP to lock)' : '· locked';
    $('pubopen').style.color = d.open ? 'var(--amber)' : 'var(--green)';
    el.innerHTML = (d.publishers||[]).length
      ? d.publishers.map(ip=>`<span class="pubip">${ip}<button class="pubx" data-ip="${ip}">×</button></span>`).join('')
      : '<span class="sub">none — publish is OPEN</span>';
    el.querySelectorAll('.pubx').forEach(b=>b.onclick=()=>removePublisher(b.dataset.ip));
  }catch(e){ const el=$('publist'); if(el) el.innerHTML=`<span class="sub" style="color:var(--red)">${e.message}</span>`; }
}
async function changePublisher(method, ip){
  const msg=$('pubmsg');
  if(!IP_RE.test(ip)){ if(msg){msg.textContent='invalid IP';msg.style.color='var(--red)';} return; }
  try{
    const r=await fetch('/admin/api/publishers',{method,headers:{'Content-Type':'application/json'},body:JSON.stringify({ip})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(msg){msg.textContent=method==='POST'?'added '+ip:'removed '+ip;msg.style.color='var(--muted)';}
    if(method==='POST') $('pubip').value='';
    loadPublishers();
  }catch(e){ if(msg){msg.textContent=e.message;msg.style.color='var(--red)';} }
}
function addPublisher(){ changePublisher('POST', $('pubip').value.trim()); }
function removePublisher(ip){ changePublisher('DELETE', ip); }
function wirePublishers(){
  const btn=$('pubaddbtn'); if(btn) btn.onclick=addPublisher;
  const inp=$('pubip'); if(inp) inp.onkeydown=(e)=>{ if(e.key==='Enter') addPublisher(); };
  loadPublishers();
}

let failCount=0;
async function poll(){
  try{
    // Try the fleet endpoint first; fall back to single-node if not configured.
    let r = await fetch('/admin/api/fleet',{cache:'no-store'});
    if(r.ok){
      const f = await r.json();
      if(f.error) throw new Error(f.error);
      if(f.nodes && f.nodes.length>1){ renderFleet(f); }
      else { renderFleet(f); }   // single node still renders as a 1-node fleet
    } else {
      r = await fetch('/admin/api/stats',{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d = await r.json();
      if(d.error) throw new Error(d.error);
      render(d);
    }
    failCount=0;
    $('refresh').textContent = 'updated '+new Date().toLocaleTimeString();
  }catch(e){
    failCount++;
    $('refresh').textContent = 'stale ('+failCount+') · '+e.message;
    if(failCount>=3){ $('status').className='status STALE'; $('status').textContent='STALE'; }
  }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
