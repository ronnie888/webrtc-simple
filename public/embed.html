<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Stream</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      /* no text selection / drag */
      -webkit-user-select: none; -moz-user-select: none; user-select: none;
    }
    #remoteVideo {
      width: 100%; height: 100%; object-fit: contain; background: #000;
      pointer-events: none;            /* swallow clicks: no native menu, no scrub */
      -webkit-user-select: none; user-select: none;
    }
    .loading-overlay {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 46px; height: 46px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.85);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-overlay {
      position: fixed; inset: 0; background: #000; color: #ffcf6b;
      display: none; align-items: center; justify-content: center;
      z-index: 200; font: 14px system-ui, sans-serif; text-align: center; padding: 24px;
    }
    .error-overlay.show { display: flex; }
    /* Sound button — the ONLY interactive element. The <video> keeps
       pointer-events:none (no native menu/scrub), so this is how a viewer
       supplies the user-gesture browsers require to allow audio. */
    #soundBtn {
      position: fixed; left: 12px; bottom: 12px; z-index: 150;
      display: none;                      /* shown once a track is playing */
      align-items: center; gap: 7px;
      padding: 9px 14px; border: 0; border-radius: 999px;
      background: rgba(0,0,0,0.62); color: #fff;
      font: 600 13px/1 system-ui, sans-serif; cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, opacity 0.3s;
    }
    #soundBtn.show { display: inline-flex; }
    #soundBtn:hover { background: rgba(0,0,0,0.8); }
    #soundBtn svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
    /* Muted state shouts (viewers must know they're missing audio);
       unmuted state is a quiet toggle. */
    #soundBtn.muted { background: rgba(220,38,38,0.85); }
    #soundBtn.muted:hover { background: rgba(220,38,38,1); }
    #soundBtn .lbl { display: none; }
    #soundBtn.muted .lbl { display: inline; }
  </style>
</head>
<body>
  <!-- No controls; PiP/remote-playback/download disabled; pointer-events:none blocks the right-click menu. -->
  <video id="remoteVideo" autoplay playsinline webkit-playsinline muted
         x-webkit-airplay="deny" disablePictureInPicture disableRemotePlayback
         controlsList="nodownload noremoteplayback nofullscreen"></video>

  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>
  <div id="errorOverlay" class="error-overlay"><div id="errorText">Connection failed</div></div>

  <!-- Autoplay must start muted (browsers block autoplay WITH sound), so audio
       needs one user gesture to turn on. This button is that gesture. -->
  <button id="soundBtn" class="muted" type="button" aria-label="Unmute">
    <svg id="iconMuted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    <svg id="iconSound" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <span class="lbl">Tap for sound</span>
  </button>

  <script>
    // Belt-and-suspenders: block the context menu everywhere (no "Save video as", no PiP entry).
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());

    const video = document.getElementById('remoteVideo');
    const loading = document.getElementById('loadingOverlay');
    const errorOverlay = document.getElementById('errorOverlay');
    const errorText = document.getElementById('errorText');
    const showError = (t) => { errorText.textContent = t; errorOverlay.classList.add('show'); };
    const hideLoading = () => loading.classList.add('hidden');

    // ---- sound ----
    // The stream carries audio (Kurento forwards it), but autoplay policy forces
    // us to start muted or the video never starts. One tap flips it on.
    const soundBtn = document.getElementById('soundBtn');
    const iconMuted = document.getElementById('iconMuted');
    const iconSound = document.getElementById('iconSound');
    const paintSound = () => {
      soundBtn.classList.toggle('muted', video.muted);
      iconMuted.style.display = video.muted ? '' : 'none';
      iconSound.style.display = video.muted ? 'none' : '';
      soundBtn.setAttribute('aria-label', video.muted ? 'Unmute' : 'Mute');
    };
    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      if (!video.muted) { video.volume = 1; video.play().catch(() => {}); }
      paintSound();
    });
    // Some contexts (a partner page the user already clicked in) permit sound
    // right away — try it, and silently keep muted if the browser refuses.
    const tryAutoUnmute = () => {
      video.muted = false;
      video.play().then(paintSound).catch(() => { video.muted = true; paintSound(); });
    };
    const showSound = () => { soundBtn.classList.add('show'); paintSound(); };

    // Token from ?lt= forwarded to the WS connect; server enforces it at the handshake.
    const lt = new URLSearchParams(location.search).get('lt') || '';
    const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://')
      + location.host + '/ws' + (lt ? ('?lt=' + encodeURIComponent(lt)) : '');
    const ws = new WebSocket(wsUrl);
    let pc, iceServers = [];

    ws.onopen = () => ws.send(JSON.stringify({ id: 'watch' }));
    ws.onclose = () => { if (!video.srcObject) showError('Disconnected'); };
    ws.onerror = () => showError('Connection error');

    ws.onmessage = async (e) => {
      const msg = JSON.parse(e.data);
      if (msg.id === 'iceServers') {
        iceServers = msg.iceServers;
        pc = new RTCPeerConnection({ iceServers });
        pc.ontrack = (ev) => {
          video.srcObject = ev.streams[0];
          hideLoading();
          tryAutoUnmute();   // best effort; falls back to muted + button
          showSound();
        };
        pc.onicecandidate = (ev) => { if (ev.candidate) ws.send(JSON.stringify({ id: 'ice', candidate: ev.candidate })); };
        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('audio', { direction: 'recvonly' });
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ id: 'offer', sdp: offer.sdp }));
      } else if (msg.id === 'answer') {
        await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
      } else if (msg.id === 'ice') {
        try { await pc.addIceCandidate(msg.candidate); } catch (err) { console.warn(err); }
      } else if (msg.id === 'error') {
        showError(/token/i.test(msg.message) ? 'Access denied' : ('Error: ' + msg.message));
      }
    };
  </script>
</body>
</html>
