# nginx with the RTMP module. RTMP ingest + serves viewer.html + proxies /ws.
worker_processes auto;
events { worker_connections 4096; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        application live {
            live on;
            # Low-latency tuning carried from fleet experience.
            wait_key on;
            wait_video on;
            sync 10ms;
            # OBS pushes rtmp://VPS:1935/live/stream ; Kurento pulls localhost.
            allow publish all;     # no security per spec; restrict by IP later if wanted
            allow play all;
        }
    }
}

http {
    server {
        listen 80;
        root /var/www/webrtc-simple;   # viewer.html copied here by setup.sh
        index viewer.html;

        location / { try_files $uri $uri/ =404; }

        # WebSocket signaling -> Node on :3000
        location /ws {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # nginx-RTMP stat for debugging (publishers count etc.)
        location /stat { rtmp_stat all; }
    }
}
