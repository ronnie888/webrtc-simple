# coturn — TURN relay for Chrome. Static creds (rotate later if wanted).
listening-port=3478
fingerprint
lt-cred-mech
user=webrtc:changeme
realm=webrtc-simple
# Set these two via sed in setup.sh to the VPS public IP:
listening-ip=0.0.0.0
external-ip=PUBLIC_IP_PLACEHOLDER
min-port=49152
max-port=65535
no-tls
no-dtls
# Allow relaying to the host's own IPs where Kurento's media endpoint lives.
# Without these, coturn returns "403 Forbidden IP" on relay allocation, so any
# client that NEEDS a relay (Telegram/iOS in-app webviews, UDP-blocked mobile
# networks) gets BLACK video. setup.sh sed-fills PRIVATE_IP_PLACEHOLDER +
# PUBLIC_IP_PLACEHOLDER. (Chrome desktop uses a direct candidate so it works
# even without this — which masks the bug.)
no-multicast-peers
allowed-peer-ip=PRIVATE_IP_PLACEHOLDER
allowed-peer-ip=PUBLIC_IP_PLACEHOLDER
